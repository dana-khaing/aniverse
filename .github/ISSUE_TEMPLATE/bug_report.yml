name: Bug report
description: Report reproducible AniVerse behavior that is not working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve AniVerse. Do not include secrets, personal data, or security vulnerabilities here.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        [
          Discovery,
          Playback,
          Community,
          Creator tools,
          Account,
          Administration,
          Offline/PWA,
          Other,
        ]
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Safari 18 on iPhone 15
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots or logs after removing private information.
