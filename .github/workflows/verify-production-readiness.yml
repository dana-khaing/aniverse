name: Verify production provider readiness

on:
  workflow_dispatch:
    inputs:
      probe_live_services:
        description: Probe provider APIs and the deployed health endpoint
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-provider-verification
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pull production configuration
        run: >-
          pnpm dlx vercel@57.0.0 pull
          --yes
          --environment=production
          --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Validate provider configuration
        run: >-
          node --env-file=.vercel/.env.production.local
          scripts/verify-provider-config.mjs
      - name: Build the production artifact
        run: >-
          pnpm dlx vercel@57.0.0 build
          --prod
          --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Probe live providers
        if: ${{ inputs.probe_live_services }}
        run: >-
          node --env-file=.vercel/.env.production.local
          scripts/verify-provider-config.mjs
          --probe
