    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#08080d"/>
  <circle cx="256" cy="256" r="116" fill="url(#planet)" stroke="#b874ff" stroke-width="14" filter="url(#glow)"/>
  <ellipse cx="256" cy="256" rx="178" ry="61" fill="none" stroke="#ead9ff" stroke-width="12" transform="rotate(-30 256 256)"/>
  <circle cx="402" cy="163" r="23" fill="#fff" stroke="#c88cff" stroke-width="8" filter="url(#glow)"/>
</svg>
