<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AniVerse orbit">
  <defs>
    <radialGradient id="planet" cx="35%" cy="28%" r="72%">
      <stop offset="0" stop-color="#d9b8ff"/>
      <stop offset="0.38" stop-color="#a55fff"/>
      <stop offset="1" stop-color="#4b2470"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
